<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Shop & Admin Systém</title>
    <!-- Tailwind CSS pre moderný vzhľad -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Knižnica na generovanie QR kódov -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen text-gray-800">

    <!-- Navigácia -->
    <nav class="bg-indigo-600 text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold">Obchod s Kódmi</h1>
        <div>
            <button onclick="switchTab('shop')" class="px-4 py-2 rounded bg-indigo-700 hover:bg-indigo-800 mr-2">Obchod</button>
            <button onclick="switchTab('admin')" class="px-4 py-2 rounded bg-red-600 hover:bg-red-700 font-semibold">Developer Mode</button>
        </div>
    </nav>

    <div class="container mx-auto p-6">

        <!-- SEKČIA: OBCHOD -->
        <div id="shop-section">
            <h2 class="text-2xl font-bold mb-4">Dostupné produkty</h2>
            <div id="product-list" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>

            <!-- Modal pre vygenerovaný QR Kód -->
            <div id="qr-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4">
                <div class="bg-white p-6 rounded-lg shadow-xl max-w-sm w-full text-center">
                    <h3 class="text-xl font-bold mb-2">Tvoja Objednávka</h3>
                    <p class="text-sm text-gray-600 mb-4">Odfoť si alebo ulož tento QR kód a prines ho pri platbe.</p>
                    <div id="qrcode" class="flex justify-center mb-4"></div>
                    <p class="text-xs text-gray-500 mb-2">Šifrovaný kód:</p>
                    <p id="order-code-display" class="font-mono text-sm bg-gray-100 p-2 rounded break-all select-all font-bold text-indigo-600"></p>
                    <button onclick="closeModal()" class="mt-4 w-full bg-gray-800 text-white py-2 rounded hover:bg-gray-900">Zatvoriť</button>
                </div>
            </div>
        </div>

        <!-- SEKČIA: DEVELOPER MODE (ADMIN) -->
        <div id="admin-section" class="hidden">
            <h2 class="text-2xl font-bold mb-6 text-red-600">Developer Mode</h2>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <!-- Formulár na pridanie produktu -->
                <div class="bg-white p-6 rounded-lg shadow-md">
                    <h3 class="text-xl font-bold mb-4">Pridať Nový Produkt</h3>
                    <form id="add-product-form" onsubmit="handleCreateProduct(event)" class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium">Názov produktu</label>
                            <input type="text" id="p-title" required class="w-full border p-2 rounded mt-1">
                        </div>
                        <div>
                            <label class="block text-sm font-medium">Cena (€)</label>
                            <input type="number" step="0.01" id="p-price" required class="w-full border p-2 rounded mt-1">
                        </div>
                        <div>
                            <label class="block text-sm font-medium">Typ platby</label>
                            <select id="p-type" class="w-full border p-2 rounded mt-1">
                                <option value="once">Jednorazovo</option>
                                <option value="monthly">Mesačné predplatné / prenájom (automaticky)</option>
                            </select>
                        </div>
                        <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded font-bold hover:bg-indigo-700">Uložiť Produkt</button>
                    </form>
                </div>

                <!-- Overenie a Zmazanie Kódu -->
                <div class="bg-white p-6 rounded-lg shadow-md">
                    <h3 class="text-xl font-bold mb-4">Overiť a Zmazať Kód</h3>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium">Vlož Šifrovaný Kód alebo text z QR</label>
                            <input type="text" id="verify-input" placeholder="Vlož kód..." class="w-full border p-2 rounded mt-1">
                        </div>
                        <button onclick="handleVerifyCode()" class="w-full bg-green-600 text-white py-2 rounded font-bold hover:bg-green-700">Skontrolovať a Vymazať</button>
                        <div id="verify-result" class="text-sm font-semibold mt-2"></div>
                    </div>
                </div>
            </div>

            <!-- Zoznam Aktívnych Objednávok / Kódov -->
            <div class="mt-8 bg-white p-6 rounded-lg shadow-md">
                <h3 class="text-xl font-bold mb-4">Aktívne Objednávky & Šifrované Kódy</h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-100 border-b">
                                <th class="p-3">Produkt</th>
                                <th class="p-3">Cena</th>
                                <th class="p-3">Šifrovaný Kód</th>
                                <th class="p-3">Dátum / Expirácia</th>
                                <th class="p-3">Akcia</th>
                            </tr>
                        </thead>
                        <tbody id="orders-table-body"></tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <script>
        // --- POMOCNÉ FUNKCIE PRE ÚLOŽISKO (LOCALSTORAGE) ---
        const getProducts = () => JSON.parse(localStorage.getItem('eshop_products') || '[]');
        const saveProducts = (p) => localStorage.setItem('eshop_products', JSON.stringify(p));
        
        const getOrders = () => JSON.parse(localStorage.getItem('eshop_orders') || '[]');
        const saveOrders = (o) => localStorage.setItem('eshop_orders', JSON.stringify(o));

        // --- ŠIFROVANIE (HMAC-SHA256 simulované cez Web Crypto API) ---
        async function generateEncryptedCode(orderId, productTitle) {
            const secret = "MOJ_TAJNY_KLUC_123";
            const data = `${orderId}-${productTitle}-${Date.now()}`;
            
            const encoder = new TextEncoder();
            const keyData = encoder.encode(secret);
            const messageData = encoder.encode(data);

            const cryptoKey = await crypto.subtle.importKey(
                'raw', keyData, { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']
            );
            const signature = await crypto.subtle.sign('HMAC', cryptoKey, messageData);
            const hashArray = Array.from(new Uint8Array(signature));
            const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('').substring(0, 16);

            return `ORD-${orderId}-${hashHex.toUpperCase()}`;
        }

        // --- MANIPULÁCIA SO STRÁNKOU A TABMI ---
        function switchTab(tab) {
            document.getElementById('shop-section').classList.toggle('hidden', tab !== 'shop');
            document.getElementById('admin-section').classList.toggle('hidden', tab !== 'admin');
            if (tab === 'shop') renderShop();
            if (tab === 'admin') renderAdmin();
        }

        // --- VYSA DZANIE OBCHODU ---
        function renderShop() {
            processSubscriptions(); // Kontrola a automatické obnovenie predplatného
            const products = getProducts();
            const container = document.getElementById('product-list');
            container.innerHTML = '';

            if (products.length === 0) {
                container.innerHTML = `<p class="text-gray-500 col-span-3">Zatiaľ neboli pridané žiadne produkty. Prepni do Developer Mode a pridaj prvý.</p>`;
                return;
            }

            products.forEach(p => {
                const card = document.createElement('div');
                card.className = 'bg-white p-5 rounded-lg shadow border flex flex-col justify-between';
                card.innerHTML = `
                    <div>
                        <h3 class="text-lg font-bold">${p.title}</h3>
                        <p class="text-2xl font-extrabold text-indigo-600 my-2">${p.price.toFixed(2)} €</p>
                        <span class="inline-block px-2 py-1 text-xs rounded ${p.type === 'monthly' ? 'bg-amber-100 text-amber-800' : 'bg-gray-100 text-gray-800'}">
                            ${p.type === 'monthly' ? 'Mesačný prenájom' : 'Jednorazový nákup'}
                        </span>
                    </div>
                    <button onclick="buyProduct('${p.id}')" class="mt-4 w-full bg-indigo-600 text-white py-2 rounded hover:bg-indigo-700 font-bold">Kúpiť / Rezervovať</button>
                `;
                container.appendChild(card);
            });
        }

        // --- NÁKUP PRODUKTU A GENEREOVANIE QR KÓDU ---
        async function buyProduct(productId) {
            const products = getProducts();
            const product = products.find(p => p.id === productId);
            if (!product) return;

            const orderId = Math.floor(1000 + Math.random() * 9000);
            const code = await generateEncryptedCode(orderId, product.title);

            const newOrder = {
                id: orderId,
                productId: product.id,
                title: product.title,
                price: product.price,
                type: product.type,
                code: code,
                createdAt: new Date().toISOString(),
                nextBillingDate: product.type === 'monthly' ? new Date(Date.now() + 30*24*60*60*1000).toISOString() : null
            };

            const orders = getOrders();
            orders.push(newOrder);
            saveOrders(orders);

            // Zobrazenie Modal okna s QR kódom
            document.getElementById('order-code-display').innerText = code;
            const qrContainer = document.getElementById('qrcode');
            qrContainer.innerHTML = '';
            new QRCode(qrContainer, {
                text: code,
                width: 180,
                height: 180
            });

            document.getElementById('qr-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('qr-modal').classList.add('hidden');
        }

        // --- DEVELOPER MODE / ADMIN FUNKCIONALITA ---
        function handleCreateProduct(e) {
            e.preventDefault();
            const title = document.getElementById('p-title').value;
            const price = parseFloat(document.getElementById('p-price').value);
            const type = document.getElementById('p-type').value;

            const newProduct = { id: 'prod_' + Date.now(), title, price, type };
            const products = getProducts();
            products.push(newProduct);
            saveProducts(products);

            e.target.reset();
            alert('Produkt bol úspešne pridaný!');
            renderAdmin();
        }

        function renderAdmin() {
            const orders = getOrders();
            const tbody = document.getElementById('orders-table-body');
            tbody.innerHTML = '';

            if (orders.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-gray-500">Žiadne aktívne objednávky.</td></tr>`;
                return;
            }

            orders.forEach(o => {
                const tr = document.createElement('tr');
                tr.className = 'border-b hover:bg-gray-50';
                tr.innerHTML = `
                    <td class="p-3 font-semibold">${o.title}</td>
                    <td class="p-3">${o.price.toFixed(2)} €</td>
                    <td class="p-3 font-mono text-xs text-indigo-600 font-bold">${o.code}</td>
                    <td class="p-3 text-sm">${o.type === 'monthly' ? 'Obnovenie: ' + new Date(o.nextBillingDate).toLocaleDateString() : 'Jednorazovo'}</td>
                    <td class="p-3">
                        <button onclick="deleteOrder('${o.code}')" class="bg-red-500 text-white px-3 py-1 rounded text-xs hover:bg-red-600">Zmazať / Využité</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function handleVerifyCode() {
            const inputCode = document.getElementById('verify-input').value.trim();
            const resultDiv = document.getElementById('verify-result');
            
            if (!inputCode) return;

            const orders = getOrders();
            const index = orders.findIndex(o => o.code === inputCode);

            if (index !== -1) {
                const found = orders[index];
                orders.splice(index, 1); // Zmazanie z databázy
                saveOrders(orders);

                resultDiv.className = "text-sm font-semibold mt-2 text-green-600";
                resultDiv.innerText = `✅ Kód bol Platný! Objednávka pre "${found.title}" (${found.price} €) bola overená a vymazaná.`;
                document.getElementById('verify-input').value = '';
                renderAdmin();
            } else {
                resultDiv.className = "text-sm font-semibold mt-2 text-red-600";
                resultDiv.innerText = `❌ Neplatný alebo už vymazaný kód!`;
            }
        }

        function deleteOrder(code) {
            let orders = getOrders();
            orders = orders.filter(o => o.code !== code);
            saveOrders(orders);
            renderAdmin();
        }

        // --- AUTOMATICKÁ LOGIKA PRE PREDPATNÉ / PRENÁJOM ---
        function processSubscriptions() {
            const orders = getOrders();
            const now = new Date();
            let updated = false;

            orders.forEach(o => {
                if (o.type === 'monthly' && o.nextBillingDate) {
                    const billingDate = new Date(o.nextBillingDate);
                    // Ak prešiel mesiac, posunie sa billing date na ďalší mesiac
                    if (now >= billingDate) {
                        billingDate.setMonth(billingDate.getMonth() + 1);
                        o.nextBillingDate = billingDate.toISOString();
                        updated = true;
                    }
                }
            });

            if (updated) saveOrders(orders);
        }

        // Inicializácia pri prvom načítaní
        renderShop();
    </script>
</body>
</html>
